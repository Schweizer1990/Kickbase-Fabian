name: Run Daily Predictions

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'reports/**'
  schedule:
    # GitHub Actions cron uses UTC. During Swiss summer time (CEST),
    # these runs are approximately 06:30, 12:00 and 19:00 local time.
    - cron: '30 4 * * *'
    - cron: '0 10 * * *'
    - cron: '0 17 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Report runs write the same generated files. Queue them instead of allowing
# simultaneous runs to create report/report merge conflicts.
concurrency:
  group: kickbase-report-publisher
  cancel-in-progress: false

jobs:
  run-daily-predictions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily predictions
        env:
          KICK_USER: ${{ secrets.KICK_USER }}
          KICK_PASS: ${{ secrets.KICK_PASS }}
          KICKBASE_LEAGUE_NAME: ${{ vars.KICKBASE_LEAGUE_NAME }}
          KICKBASE_LEAGUE_START_DATE: ${{ vars.KICKBASE_LEAGUE_START_DATE }}
          KICKBASE_START_BUDGET: ${{ vars.KICKBASE_START_BUDGET }}
          ENABLE_EMAIL: ${{ vars.ENABLE_EMAIL }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: python daily_predictions.py

      - name: Publish reports
        run: |
          git config user.name "kickbase-report-bot"
          git config user.email "actions@users.noreply.github.com"

          # Preserve the freshly generated reports outside the worktree. Then
          # rebase implicitly by resetting to the latest remote main and copying
          # only the generated report files back. Generated JSON should replace
          # older generated JSON rather than be line-merged.
          mkdir -p /tmp/kickbase-reports
          cp reports/latest.json /tmp/kickbase-reports/latest.json
          cp reports/transfers.json /tmp/kickbase-reports/transfers.json
          cp reports/history.json /tmp/kickbase-reports/history.json

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            mkdir -p reports
            cp /tmp/kickbase-reports/latest.json reports/latest.json
            cp /tmp/kickbase-reports/transfers.json reports/transfers.json
            cp /tmp/kickbase-reports/history.json reports/history.json
            git add reports/latest.json reports/transfers.json reports/history.json

            if git diff --cached --quiet; then
              echo "No report changes to publish."
              exit 0
            fi

            git commit -m "Update Kickbase reports"
            if git push origin main; then
              exit 0
            fi

            echo "Report push raced with another update; retrying ($attempt/3)..."
          done

          echo "Could not publish reports after 3 attempts."
          exit 1
