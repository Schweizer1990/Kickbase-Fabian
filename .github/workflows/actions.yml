name: Run Daily Predictions

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'reports/**'
  schedule:
    # GitHub Actions cron uses UTC. During Swiss summer time (CEST),
    # these runs are approximately 06:30, 12:00 and 19:00 local time.
    - cron: '30 4 * * *'
    - cron: '0 10 * * *'
    - cron: '0 17 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-daily-predictions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily predictions
        env:
          KICK_USER: ${{ secrets.KICK_USER }}
          KICK_PASS: ${{ secrets.KICK_PASS }}
          KICKBASE_LEAGUE_NAME: ${{ vars.KICKBASE_LEAGUE_NAME }}
          KICKBASE_LEAGUE_START_DATE: ${{ vars.KICKBASE_LEAGUE_START_DATE }}
          KICKBASE_START_BUDGET: ${{ vars.KICKBASE_START_BUDGET }}
          ENABLE_EMAIL: ${{ vars.ENABLE_EMAIL }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: python daily_predictions.py

      - name: Publish reports
        run: |
          git config user.name "kickbase-report-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/latest.json reports/transfers.json reports/history.json
          if git diff --cached --quiet; then
            echo "No report changes to publish."
          else
            git commit -m "Update Kickbase reports"
            # daily_predictions.py can modify local runtime/cache files that are
            # not meant to be published. Discard those before rebasing so they
            # cannot block the report push.
            git reset --hard HEAD
            git clean -fd
            git pull --rebase origin main
            git push origin main
          fi
